name: CI

# 把 AGENTS.md 里的「门禁」从本地搬到每次 push。
# 本地跑 ./init.ps1 是自觉，这里跑是强制执行——换机器、忘跑、别人提交，都拦得住。
#
# 刻意不含的两项：
#   - oxfmt 格式检查：格式不该阻断合并，留给人自己 pnpm format
#   - android/ 打包 APK：需要 Android SDK，属发布流程，不属代码门禁
#
# 网页版（GitHub Pages）在本文件的 deploy 作业里发布，依赖 gates 通过。
# 发出去的是 gates 产出的那一份 dist，不重新构建——发布的东西必须就是被验过的东西。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: 门禁（type / lint / test / build / 兼容）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm type

      - name: 静态检查
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      - name: 生产构建
        run: pnpm build

      - name: 产物齐全
        run: |
          set -euo pipefail
          test -f dist/index.html   || { echo "缺少 dist/index.html"; exit 1; }
          test -f dist/LICENSE      || { echo "缺少 dist/LICENSE（本仓 AGPL-3.0 全文）"; exit 1; }
          test -f dist/LICENSE-upstream || { echo "缺少 dist/LICENSE-upstream（上游 MIT 全文）"; exit 1; }
          test -f dist/NOTICE       || { echo "缺少 dist/NOTICE（归属说明）"; exit 1; }
          test -d dist/static/js    || { echo "缺少 dist/static/js"; exit 1; }
          test -d dist/static/css   || { echo "缺少 dist/static/css"; exit 1; }
          echo "产物齐全：$(find dist/static -type f | wc -l) 个静态文件"

      # 有内核门槛但没兜底的写法：老 WebView 上静默失效（2026-11 的 100dvh 白屏就是这类）
      - name: 内核兼容
        run: node tools/scan-compat.mjs

      # 发布用：把门禁验过的那份产物交出去。PR 上不传，省时间，也避免两份来路的产物混淆。
      - name: 保存产物
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  # 网页版发布：push 到 main（或手动触发）且门禁全绿才发。
  deploy:
    name: 发布网页版（GitHub Pages）
    needs: gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # 发布串行：两次发布不能交错，否则 Pages 上可能是旧的
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: 取回门禁产出的 dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 打成 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
